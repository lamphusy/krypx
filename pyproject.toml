[build-system]
requires = ["setuptools>=75,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "krypx"
version = "0.1.0"
description = "Point-in-time-correct crypto trading signal research pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sy Lam" }]
dependencies = [
    "ccxt>=4.4,<5",
    "numpy>=1.26,<2.4",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "scikit-learn>=1.5,<2",
    "ta>=0.11,<0.12",
    "xgboost>=2.1,<3.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.10,<27",
    "pytest>=8.3,<10",
    "pytest-mock>=3.14,<4",
    "ruff>=0.8,<1",
]

[project.scripts]
krypx = "crypto_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
